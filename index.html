<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Factoring</title>
    <!-- светлая тема по умолчанию, как на макете рис. 4 BRD; тёмная - только по выбору в меню пользователя (localStorage).
         Класс ставится до первой отрисовки, без мигания -->
    <script>
      (() => {
        try {
          document.documentElement.classList.toggle('dark', localStorage.getItem('theme') === 'dark');
        } catch {
          // хранилище недоступно - светлая тема
        }
      })();
    </script>
    <!-- настройки стенда (адрес Keycloak, realm, клиент): в образе файл пишется при старте контейнера -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
